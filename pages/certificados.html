<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Certificados | João Victor</title>
</head>
<body>
    
    <header class="header-container">
        <nav class="navegacao">
            <div class="logo">JOÃO<span>VICTOR</span></div>
            <ul class="menu">
                <li><a href="../index.html" class="menu-link">Voltar ao Início</a></li>
            </ul>
        </nav>
    </header>

    <main class="section-container">
        <div class="catalog-header" data-anime="up">
            <h1 class="section-title">Certificados</h1>
            <p style="text-align: center; color: var(--text-gray); margin-top: -30px; margin-bottom: 50px;">
                Uma visão detalhada dos certificados que obtive.
            </p>
        </div>

        <div class="certificados-grid">

            <div class="certificado-card" data-anime="up">
                <div class="card-img">
                    <img src="../assets/IMG/certificado-html-css.png" alt="Certificado HTML e CSS">
                </div>
                <div class="card-body">
                    <h3 style="color: var(--primary); margin-bottom: 10px;">HTML e CSS</h3>
                    <p style="color: var(--text-gray); font-size: 0.9rem; margin-bottom: 15px;">
                        Certificado de conclusão do curso de HTML e CSS.
                    </p>
                    <a href="../assets/IMG/certificado-html-css.png" class="btn-enviar" style="display: block; text-align: center; text-decoration: none; margin-top: 20px;">Ver Certificado</a>
                </div>
            </div>

            <div class="certificado-card" data-anime="up">
                <div class="card-img">
                    <img src="../assets/IMG/certificado-js.png" alt="Certificado JavaScript">
                </div>
                <div class="card-body">
                    <h3 style="color: var(--primary); margin-bottom: 10px;">JavaScript</h3>
                    <p style="color: var(--text-gray); font-size: 0.9rem; margin-bottom: 15px;">
                        Certificado de conclusão do curso de JavaScript.
                    </p>
                    <a href="../assets/IMG/certificado-js.png" class="btn-enviar" style="display: block; text-align: center; text-decoration: none; margin-top: 20px;">Ver Certificado</a>
                </div>
            </div>

        </div>
</body>
</html>
